# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Cria o backend NestJS (Web Service gratuito) e o frontend Vite (Static Site
# gratuito, vindo do repositório modeladb-frontend).
# Valores marcados com sync: false são pedidos no painel ao aplicar o blueprint.
services:
  - type: web
    name: modeladb-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.19.6
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false

  - type: web
    name: modeladb-frontend
    runtime: static
    repo: https://github.com/duda8399/modeladb-frontend
    branch: master
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA: qualquer rota do React Router cai no index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.6
      # URL pública do backend, ex.: https://modeladb-backend.onrender.com
      - key: VITE_BACKEND_URL
        sync: false
